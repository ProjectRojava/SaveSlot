[package]
name = "rojava-db-client"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI Framework - Iced 0.13.1
iced = { version = "0.13.1", features = ["tokio", "debug"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Domain modeling
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# Testing
mockall = "0.12"
tokio-test = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"